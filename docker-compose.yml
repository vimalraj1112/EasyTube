# ---------------------------------------------------------------------------
# EasyTube - local infrastructure
#
# Phase 1 ships the datastores only, so `docker compose up -d` gives you a
# working MongoDB + Redis with no Node toolchain required.
#
# The `api` and `web` services (with their Dockerfiles) are added in Phase 16.
# ---------------------------------------------------------------------------

name: easytube

services:
  mongodb:
    image: mongo:7
    container_name: easytube-mongodb
    restart: unless-stopped
    ports:
      - '27017:27017'
    environment:
      MONGO_INITDB_DATABASE: easytube
    volumes:
      - mongodb-data:/data/db
    healthcheck:
      test: ['CMD', 'mongosh', '--quiet', '--eval', "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  redis:
    image: redis:7-alpine
    container_name: easytube-redis
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes', '--maxmemory-policy', 'noeviction']
    ports:
      - '6379:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  mongodb-data:
  redis-data:
